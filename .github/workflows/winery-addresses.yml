name: Find winery addresses

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  addresses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Look up addresses from each winery's website
        run: node scripts/winery-addresses.mjs
      - name: Commit results
        run: |
          git config user.name "events-bot"
          git config user.email "actions@github.com"
          git add data/winery-addresses.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Update winery addresses"; git pull --rebase origin main; git push; fi
